name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Checks (source)
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      VERIFY_SHARD: source
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check generated contract documents
        run: node src/base/contract-docs.mjs check
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Prepare runner-owned browser and apt caches
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: pantry-ubuntu24-temp-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            node scripts/ci/chromium-probe.mjs
          }
      # rer verify builds once, then checks the emitted runtime, hosted output and hydration.
      - name: Verify source, emitted runtime, site and hosted hydration
        run: pnpm run verify
      - name: Archive the shared build
        run: tar -cf "$RUNNER_TEMP/verify-build.tar" dist
      - name: Share the verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-build
          path: ${{ runner.temp }}/verify-build.tar
          retention-days: 1
          if-no-files-found: error

  api:
    name: Checks (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-import
            shards: api-1
          - name: api-report
            shards: api-2
          - name: api-browser
            shards: api-3 api-4
          - name: api-ledger
            shards: api-5
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      VERIFY_SHARDS: ${{ matrix.shards }}
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Prepare runner-owned browser and apt caches
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: pantry-ubuntu24-temp-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: ${{ matrix.name == 'api-browser' }}
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            node scripts/ci/chromium-probe.mjs
          }
      - name: Verify API partitions
        run: |
          set -euo pipefail
          for shard in $VERIFY_SHARDS; do
            VERIFY_SHARD="$shard" pnpm run verify:app
          done

  checks:
    name: Checks (${{ matrix.name }})
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The first candidate measured app-5 at 8.9m and app-6 at 7.7m.
        # Keep them alone: four browser jobs exceeded the twelve-minute ceiling.
        include:
          - name: app-journeys-1
            shards: app-5
          - name: app-journeys-2
            shards: app-6
          - name: app-journeys-3
            shards: app-1 app-7
          - name: app-journeys-4
            shards: app-2 app-8
          - name: app-journeys-5
            shards: app-3
          - name: app-journeys-6
            shards: app-4
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      VERIFY_SHARDS: ${{ matrix.shards }}
      VERIFY_PREBUILT: 'true'
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Prepare runner-owned browser and apt caches
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: pantry-ubuntu24-temp-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Download the verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verify-build
          path: ${{ runner.temp }}
      - name: Restore the shared build
        run: tar -xf "$RUNNER_TEMP/verify-build.tar"
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            node scripts/ci/chromium-probe.mjs
          }
      - name: Verify browser partitions
        run: |
          set -euo pipefail
          for shard in $VERIFY_SHARDS; do
            VERIFY_SHARD="$shard" pnpm run verify:app
          done

  # Backup and restore as the docs give them, through rer on fresh clones.
  restore:
    name: restore (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition: [restore, erasure]
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Prepare runner-owned browser and apt caches
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: pantry-ubuntu24-temp-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            node scripts/ci/chromium-probe.mjs
          }
      # Each partition owns its fresh installations; together they retain every
      # backup, restore, start-over, occupied-target and erasure assertion.
      - run: node --test tests/restore/${{ matrix.partition }}.test.mjs

  # Preserve the required check name and require all work unless the plan reuses a green push.
  verify:
    needs: [plan, build, api, checks, restore]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
